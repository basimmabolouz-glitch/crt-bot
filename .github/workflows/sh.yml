name: SH bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "إرسال رسالة تجربة إلى تلجرام"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

jobs:
  test:
    if: github.event_name == 'workflow_dispatch' && inputs.test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Telegram test
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: python sh_actions.py --test

  run:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    concurrency:
      group: sh-bot
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      # يشغّل التشغيل التالي مسبقاً (ينتظر في الطابور حتى ينتهي هذا) فلا يتوقف البوت لو أخّر GitHub الجدولة
      - name: Queue next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sh.yml --repo "${{ github.repository }}" -f test=false || true

      - name: Run SH bot
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONIOENCODING: utf-8
        run: python sh_actions.py --loop 340

      - name: Save state
        if: always()
        run: |
          git config user.name "sh-bot"
          git config user.email "sh-bot@users.noreply.github.com"
          git add sh_state.json
          git diff --cached --quiet || (git commit -m "sh state" && git pull --rebase -q && git push)
